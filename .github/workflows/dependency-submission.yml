name: Dependency Submission

# Replaces GitHub's automatic submission, which uses the incompatible runner Maven.
# Disable "Automatic dependency submission" in Settings > Advanced Security > Dependency graph.
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  submit-maven:
    name: Submit Maven dependencies
    # Fork and Dependabot pull requests cannot submit snapshots with a read-only token.
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # needed by maven-git-versioning-extension

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "temurin"
          java-version: 21
          cache: maven

      # See build.yml: use the wrapper distribution instead of the runner Maven.
      - name: Use Maven wrapper distribution as "mvn"
        run: |
          MVN_HOME="$(./mvnw -B -v | sed -n 's/^Maven home: //p')"
          test -x "$MVN_HOME/bin/mvn"
          echo "$MVN_HOME/bin" >> "$GITHUB_PATH"

      - name: Check Maven version
        run: mvn -v

      - name: Submit dependencies
        uses: advanced-security/maven-dependency-submission-action@b275d12641ac2d2108b2cbb7598b154ad2f2cee8 # v5.0.0
